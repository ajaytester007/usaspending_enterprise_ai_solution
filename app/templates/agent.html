{% extends 'base.html' %}{% block content %}
<h2>RAG / Multi-Agent Query Console</h2>
<textarea id="q" class="form-control" rows="4">Which states had the highest total obligations?</textarea><br>
<button class="btn btn-success" onclick="ask()">Ask Agent</button>
<pre id="out" class="mt-3"></pre>
<script>
async function ask(){const r=await fetch('/api/agent/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:document.getElementById('q').value})});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}
</script>
{% endblock %}
