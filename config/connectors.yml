connectors:
  usaspending_spending_over_time:
    type: rest_post
    domain: api.usaspending.gov
    endpoint: https://api.usaspending.gov/api/v2/search/spending_over_time/
    auth_required: false
    group: quarter
    award_type_codes:
      contracts: [A, B, C, D]
      grants_assistance: ['02', '03', '04', '05']
    default_states: [PA, NJ, NY, CA, TX]
    default_year_start: 2024
    default_year_end: 2025
